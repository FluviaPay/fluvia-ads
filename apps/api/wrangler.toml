name = "fluvia-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Environments
#   top level   = development  (bare `wrangler dev`; never counts as production)
#   [env.staging]     deploy with `pnpm run deploy`
#   [env.production]  deploy with `pnpm run deploy:production`
# Bindings and vars are NOT inherited by [env.*]; each one repeats them.
#
# Secrets are never written here (rule 8). Per environment, set them with
#   wrangler secret put <NAME> --env staging|production
# DATABASE_URL, META_APP_ID, META_APP_SECRET, META_SYSTEM_USER_TOKEN, META_BUSINESS_ID,
# META_SANDBOX_AD_ACCOUNT_ID, COLOCA_*, KAPSO_*, ALEGRA_*, ANTHROPIC_API_KEY,
# TOKEN_ENCRYPTION_KEY (32 random bytes, base64), OAUTH_STATE_SECRET, INTERNAL_API_TOKEN and
# AUTH_SECRET (long random strings), RESEND_API_KEY (staff login emails). Generate each with: openssl rand -base64 32
# Each environment gets its own DATABASE_URL: staging points at a Neon *branch*.
# Setting up a client's ad account needs META_BUSINESS_ID (a secret/var), META_SYSTEM_USER_ID,
# META_AD_ACCOUNT_TIMEZONE_ID (Meta's numeric id for America/Bogota), META_END_ADVERTISER,
# META_MEDIA_AGENCY and META_PARTNER. Not decided yet (docs/plan-meta.md §8.1, §18): while
# empty, live mode creates a CONFIG_MISSING task instead of inventing values.
# Locally: .dev.vars (development) and .dev.vars.staging (`wrangler dev --env staging`).
#
# META_MODE: mock | sandbox | live. `live` is rejected unless ENVIRONMENT=production.

# --- development (default) ---------------------------------------------------
[vars]
APP_VERSION = "0.0.0"
ENVIRONMENT = "development"
META_MODE = "mock"
WEB_BASE_URL = "http://localhost:5173"
API_BASE_URL = "http://localhost:8787"
# Facebook Login for Business configuration id; only needed outside mock mode.
META_LOGIN_CONFIG_ID = ""
META_SYSTEM_USER_ID = ""
META_AD_ACCOUNT_TIMEZONE_ID = ""
META_END_ADVERTISER = ""
META_MEDIA_AGENCY = ""
META_PARTNER = ""
# Sender of the staff login emails (a domain verified in the email provider).
EMAIL_FROM = ""

[[queues.producers]]
binding = "EVENTS_QUEUE"
queue = "fluvia-events-dev"

[[queues.consumers]]
queue = "fluvia-events-dev"
# One client's setup per message: it is long, and each client is processed under its own lock.
max_batch_size = 1
# Retries are driven by the consumer (message.retry with a delay) and a task is created on
# the last attempt, so the queue must allow at least as many as the consumer uses.
max_retries = 6

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "fluvia-assets-dev"

[[durable_objects.bindings]]
name = "CLIENT_LOCK"
class_name = "ClientLock"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ClientLock"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateLimiter"]

# --- staging -------------------------------------------------------------------
[env.staging]
name = "fluvia-api-staging"

[env.staging.vars]
APP_VERSION = "0.0.0"
ENVIRONMENT = "staging"
# Switch to "sandbox" once META_SANDBOX_AD_ACCOUNT_ID and the token exist for staging.
META_MODE = "mock"
# Public origins (no trailing slash). Empty until the staging domains exist: the
# Meta connection endpoints answer 503 not_configured meanwhile.
WEB_BASE_URL = ""
API_BASE_URL = ""
META_LOGIN_CONFIG_ID = ""
META_SYSTEM_USER_ID = ""
META_AD_ACCOUNT_TIMEZONE_ID = ""
META_END_ADVERTISER = ""
META_MEDIA_AGENCY = ""
META_PARTNER = ""
# Sender of the staff login emails (a domain verified in the email provider).
EMAIL_FROM = ""

[[env.staging.queues.producers]]
binding = "EVENTS_QUEUE"
queue = "fluvia-events-staging"

[[env.staging.queues.consumers]]
queue = "fluvia-events-staging"
# One client's setup per message: it is long, and each client is processed under its own lock.
max_batch_size = 1
# Retries are driven by the consumer (message.retry with a delay) and a task is created on
# the last attempt, so the queue must allow at least as many as the consumer uses.
max_retries = 6

[[env.staging.r2_buckets]]
binding = "ASSETS"
bucket_name = "fluvia-assets-staging"

[[env.staging.durable_objects.bindings]]
name = "CLIENT_LOCK"
class_name = "ClientLock"

[[env.staging.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["ClientLock"]

[[env.staging.migrations]]
tag = "v2"
new_sqlite_classes = ["RateLimiter"]

# --- production ----------------------------------------------------------------
[env.production]
name = "fluvia-api-production"

[env.production.vars]
APP_VERSION = "0.0.0"
ENVIRONMENT = "production"
# Switch to "live" only after Meta's App Review and with META_SYSTEM_USER_TOKEN set.
META_MODE = "mock"
# Public origins (no trailing slash). Empty until the production domains exist: the
# Meta connection endpoints answer 503 not_configured meanwhile.
WEB_BASE_URL = ""
API_BASE_URL = ""
META_LOGIN_CONFIG_ID = ""
META_SYSTEM_USER_ID = ""
META_AD_ACCOUNT_TIMEZONE_ID = ""
META_END_ADVERTISER = ""
META_MEDIA_AGENCY = ""
META_PARTNER = ""
# Sender of the staff login emails (a domain verified in the email provider).
EMAIL_FROM = ""

[[env.production.queues.producers]]
binding = "EVENTS_QUEUE"
queue = "fluvia-events"

[[env.production.queues.consumers]]
queue = "fluvia-events"
# One client's setup per message: it is long, and each client is processed under its own lock.
max_batch_size = 1
# Retries are driven by the consumer (message.retry with a delay) and a task is created on
# the last attempt, so the queue must allow at least as many as the consumer uses.
max_retries = 6

[[env.production.r2_buckets]]
binding = "ASSETS"
bucket_name = "fluvia-assets"

[[env.production.durable_objects.bindings]]
name = "CLIENT_LOCK"
class_name = "ClientLock"

[[env.production.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["ClientLock"]

[[env.production.migrations]]
tag = "v2"
new_sqlite_classes = ["RateLimiter"]
